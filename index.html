<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roll the Dice</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" type="module"></script>
  </head>
  <body>
    <main class="mesa">
      <header class="cabecera">
        <h1>Roll the Dice</h1>
        <p class="saldo">Saldo <strong id="saldo">100</strong> fichas</p>
      </header>

      <div class="campo">
        <label for="apuesta">Apuesta</label>
        <input id="apuesta" type="number" min="10" step="1" value="10" />
      </div>

      <p id="tirada" class="tirada">--</p>

      <div>
        <label for="objetivo">
          Ganas si sale menos de <span id="valor-objetivo">50</span>
        </label>
        <div class="barra">
          <div id="zona-ganar" class="zona-ganar"></div>
          <div id="marca" class="marca oculto"></div>
          <input id="objetivo" type="range" min="2" max="98" value="50" />
        </div>
        <div class="escala">
          <span>0</span><span>25</span><span>50</span><span>75</span
          ><span>100</span>
        </div>
      </div>

      <div class="datos">
        <p><span>Probabilidad</span><strong id="probabilidad">50%</strong></p>
        <p><span>Multiplicador</span><strong id="multiplicador">x2</strong></p>
        <p><span>Premio</span><strong id="premio">20</strong></p>
      </div>

      <button id="boton-tirar" class="boton-tirar" type="button">Tirar</button>
      <button id="boton-reiniciar" class="boton-tirar oculto" type="button">
        Volver a empezar
      </button>

      <p id="resultado" class="resultado">Haz tu apuesta…</p>

      <section class="historial">
        <h2>Historial</h2>
        <ul id="historial" class="lista-historial"></ul>
      </section>
    </main>
  </body>
</html>
